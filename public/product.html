<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chi tiết sản phẩm</title><link rel="stylesheet" href="./styles.css"></head><body>
<header class="topbar"><div class="container nav"><a class="logo" href="./index.html">Fashion<span>AI</span></a><nav class="navlinks"><a href="./index.html">Trang chủ</a><a href="./checkout.html">Thanh toán</a><a href="./admin.html">Admin</a></nav><div class="spacer"></div><button class="btn secondary" id="cartBtn">🛒 Giỏ <span id="cartCount">0</span></button></div></header>
<main class="container detail"><div class="detail-img" id="detailImage"></div><section class="detail-card"><p class="muted" id="detailBrand"></p><h1 id="detailName" style="font-size:42px"></h1><p id="detailRating" class="badge"></p><p><span class="price" id="detailPrice"></span><span class="old" id="detailOld"></span></p><p id="detailDesc" class="lead"></p><p><b>Khuyến mãi:</b> <span id="detailPromo"></span></p><div class="chips" id="chips"></div><div class="form-grid"><label>Size<select id="sizeSelect"></select></label><label>Màu<select id="colorSelect"></select></label></div><label>Số lượng<input class="input" id="qty" type="number" min="1" value="1"></label><div class="hero-actions"><button class="btn" id="addDetail">Thêm vào giỏ</button><button class="btn secondary" id="askThis">💖 Hỏi AI về SP này</button></div><h2 style="margin-top:28px">So sánh với đối thủ</h2><table class="compare" id="competitors"></table><h2 style="margin-top:26px">Bảo quản</h2><p class="muted" id="detailCare"></p></section></main>
<section class="container"><div class="section-title"><h2>Sản phẩm tương tự</h2></div><div class="grid" id="similarGrid"></div></section>
<div id="cartDrawer" class="drawer"><aside class="panel"><button class="btn secondary" id="closeCart">Đóng</button><h2>Giỏ hàng</h2><div id="cartItems"></div><hr><p>Tạm tính: <b id="subtotal">0đ</b></p><p>Phí ship: <b id="shipping">0đ</b></p><p>Giảm giá: <b id="discount">0đ</b></p><h2>Tổng: <span id="total">0đ</span></h2><a class="btn" style="display:block;text-align:center" href="./checkout.html">Thanh toán</a></aside></div>
<div id="aiModal" class="modal"><div class="chat-panel"><div class="chat-head"><span id="aiTitle">💖 AI tư vấn sản phẩm</span><button id="closeAI" style="float:right;background:transparent;border:0;color:#fff;font-size:20px">×</button></div><div class="chat-log" id="chatLog"></div><form class="chat-form" id="chatForm"><input class="input" id="chatInput" placeholder="Hỏi AI về sản phẩm này..."><button class="btn">Gửi</button></form></div></div><button class="floating-ai" id="aiBtn">🤖<small>Hỏi AI</small></button><script src="./app.js"></script></body></html>
